<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEO – Saúde Ocupacional</title>
<style>
/* ============================================================
   RESET & VARIÁVEIS GLOBAIS
   ============================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --azul-900:#0a2540;
  --azul-800:#0d3b66;
  --azul-700:#12508a;
  --azul-600:#1a6bb5;
  --azul-500:#2b8ce0;
  --azul-400:#5aa9e6;
  --azul-100:#e8f1fa;
  --azul-50:#f4f8fd;
  --cinza-50:#f8fafc;
  --cinza-100:#f1f5f9;
  --cinza-200:#e2e8f0;
  --cinza-300:#cbd5e1;
  --cinza-500:#64748b;
  --cinza-700:#334155;
  --cinza-900:#0f172a;
  --branco:#ffffff;
  --sucesso:#10b981;
  --aviso:#f59e0b;
  --perigo:#ef4444;
  --info:#3b82f6;
  --sombra-sm:0 1px 3px rgba(10,37,64,.06);
  --sombra:0 4px 16px rgba(10,37,64,.08);
  --sombra-lg:0 12px 32px rgba(10,37,64,.12);
  --radius:12px;
  --radius-sm:8px;
  --radius-lg:20px;
  --transicao:all .25s cubic-bezier(.4,0,.2,1);
  --fonte:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--fonte);
  color:var(--cinza-900);
  background:var(--branco);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:1rem}
ul{list-style:none}

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.container-wide{max-width:1400px;margin:0 auto;padding:0 24px}
.hidden{display:none!important}
.text-center{text-align:center}
.flex{display:flex}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-24{gap:24px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}.mt-32{margin-top:32px}
.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}.mb-32{margin-bottom:32px}

/* ============================================================
   BOTÕES
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 24px;border-radius:var(--radius-sm);font-weight:600;font-size:.95rem;
  transition:var(--transicao);white-space:nowrap;line-height:1;
}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-primario{background:var(--azul-600);color:var(--branco);box-shadow:0 4px 14px rgba(26,107,181,.3)}
.btn-primario:hover{background:var(--azul-700);transform:translateY(-2px);box-shadow:0 8px 20px rgba(26,107,181,.4)}
.btn-secundario{background:var(--branco);color:var(--azul-700);border:2px solid var(--azul-100)}
.btn-secundario:hover{background:var(--azul-50);border-color:var(--azul-400)}
.btn-outline{background:transparent;color:var(--azul-700);border:2px solid var(--azul-600)}
.btn-outline:hover{background:var(--azul-600);color:var(--branco)}
.btn-ghost{background:var(--cinza-100);color:var(--cinza-700)}
.btn-ghost:hover{background:var(--cinza-200)}
.btn-perigo{background:var(--perigo);color:var(--branco)}
.btn-perigo:hover{background:#dc2626}
.btn-sm{padding:8px 16px;font-size:.85rem}
.btn-lg{padding:16px 32px;font-size:1.05rem}
.btn-block{width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}

/* ============================================================
   HEADER PÚBLICO
   ============================================================ */
.header-publico{
  position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--cinza-200);
  transition:var(--transicao);
}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;color:var(--azul-800)}
.logo-icon{
  width:40px;height:40px;background:linear-gradient(135deg,var(--azul-600),var(--azul-800));
  border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:1rem;
}
.logo-text{display:flex;flex-direction:column;line-height:1.1}
.logo-text small{font-size:.65rem;font-weight:500;color:var(--cinza-500);letter-spacing:.5px}
.nav-publico{display:flex;align-items:center;gap:4px}
.nav-publico a{
  padding:10px 16px;border-radius:var(--radius-sm);font-size:.9rem;font-weight:500;
  color:var(--cinza-700);transition:var(--transicao);
}
.nav-publico a:hover,.nav-publico a.ativo{color:var(--azul-700);background:var(--azul-50)}
.nav-publico a.ativo{font-weight:600}
.header-acoes{display:flex;align-items:center;gap:12px}
.menu-toggle{display:none;padding:8px;border-radius:8px;color:var(--azul-800)}
.menu-toggle:hover{background:var(--azul-50)}

/* Mobile nav */
@media(max-width:900px){
  .nav-publico{
    position:fixed;top:72px;left:0;right:0;background:var(--branco);
    flex-direction:column;align-items:stretch;padding:16px;gap:4px;
    border-bottom:1px solid var(--cinza-200);box-shadow:var(--sombra-lg);
    transform:translateY(-120%);opacity:0;transition:var(--transicao);pointer-events:none;
  }
  .nav-publico.aberto{transform:translateY(0);opacity:1;pointer-events:auto}
  .nav-publico a{padding:14px 16px}
  .menu-toggle{display:flex}
  .header-acoes .btn{display:none}
}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  background:linear-gradient(135deg,var(--azul-50) 0%,var(--branco) 60%,var(--azul-100) 100%);
  padding:80px 0 100px;position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-100px;right:-100px;width:500px;height:500px;
  background:radial-gradient(circle,rgba(43,140,224,.08),transparent 70%);border-radius:50%;
}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;position:relative}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:var(--branco);
  border:1px solid var(--azul-100);border-radius:100px;font-size:.8rem;font-weight:600;
  color:var(--azul-700);margin-bottom:24px;box-shadow:var(--sombra-sm);
}
.hero-badge .dot{width:8px;height:8px;background:var(--sucesso);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{font-size:clamp(2rem,4vw,3.2rem);font-weight:800;line-height:1.15;color:var(--azul-900);margin-bottom:20px;letter-spacing:-.02em}
.hero h1 span{color:var(--azul-600)}
.hero p{font-size:1.15rem;color:var(--cinza-500);margin-bottom:32px;max-width:520px}
.hero-botoes{display:flex;gap:16px;flex-wrap:wrap}
.hero-visual{position:relative}
.hero-ilustracao{
  background:linear-gradient(135deg,var(--azul-600),var(--azul-800));
  border-radius:var(--radius-lg);padding:48px;color:#fff;position:relative;overflow:hidden;
  box-shadow:var(--sombra-lg);min-height:400px;display:flex;flex-direction:column;justify-content:center;
}
.hero-ilustracao::before{
  content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.1),transparent 50%);
}
.hero-ilustracao .icone-grande{
  width:80px;height:80px;background:rgba(255,255,255,.15);border-radius:20px;
  display:flex;align-items:center;justify-content:center;margin-bottom:24px;backdrop-filter:blur(10px);
}
.hero-ilustracao h3{font-size:1.5rem;margin-bottom:12px;position:relative}
.hero-ilustracao p{color:rgba(255,255,255,.85);font-size:.95rem;position:relative}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:32px;position:relative}
.hero-stat{background:rgba(255,255,255,.1);border-radius:var(--radius);padding:16px;backdrop-filter:blur(10px)}
.hero-stat strong{display:block;font-size:1.5rem;font-weight:800}
.hero-stat span{font-size:.8rem;color:rgba(255,255,255,.8)}
@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr;gap:40px}
  .hero{padding:48px 0 64px}
}

/* ============================================================
   SECÇÕES GENÉRICAS
   ============================================================ */
.seccao{padding:80px 0}
.seccao-cinza{background:var(--cinza-50)}
.seccao-azul{background:linear-gradient(135deg,var(--azul-800),var(--azul-900));color:#fff}
.seccao-header{text-align:center;max-width:680px;margin:0 auto 56px}
.seccao-tag{
  display:inline-block;padding:6px 14px;background:var(--azul-100);color:var(--azul-700);
  border-radius:100px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;
}
.seccao-azul .seccao-tag{background:rgba(255,255,255,.15);color:#fff}
.seccao-header h2{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:800;color:var(--azul-900);margin-bottom:16px;letter-spacing:-.02em}
.seccao-azul .seccao-header h2{color:#fff}
.seccao-header p{color:var(--cinza-500);font-size:1.05rem}
.seccao-azul .seccao-header p{color:rgba(255,255,255,.8)}

/* ============================================================
   CARDS
   ============================================================ */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.card{
  background:var(--branco);border:1px solid var(--cinza-200);border-radius:var(--radius);
  padding:32px;transition:var(--transicao);position:relative;overflow:hidden;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--sombra-lg);border-color:var(--azul-400)}
.card-icone{
  width:56px;height:56px;background:var(--azul-50);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;color:var(--azul-600);margin-bottom:20px;
  transition:var(--transicao);
}
.card:hover .card-icone{background:var(--azul-600);color:#fff}
.card h3{font-size:1.15rem;font-weight:700;margin-bottom:10px;color:var(--azul-900)}
.card p{color:var(--cinza-500);font-size:.92rem;margin-bottom:16px}
.card-link{color:var(--azul-600);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.card-link:hover{gap:10px}

/* Stats/Indicadores */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
.stat-card{text-align:center;padding:32px 20px;background:var(--branco);border-radius:var(--radius);border:1px solid var(--cinza-200);transition:var(--transicao)}
.stat-card:hover{box-shadow:var(--sombra);transform:translateY(-2px)}
.stat-icone{
  width:64px;height:64px;margin:0 auto 16px;background:linear-gradient(135deg,var(--azul-500),var(--azul-700));
  border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;
}
.stat-card h4{font-size:1rem;font-weight:700;color:var(--azul-900);margin-bottom:6px}
.stat-card p{font-size:.85rem;color:var(--cinza-500)}

/* ============================================================
   CTA
   ============================================================ */
.cta{
  background:linear-gradient(135deg,var(--azul-700),var(--azul-900));border-radius:var(--radius-lg);
  padding:64px 48px;text-align:center;color:#fff;position:relative;overflow:hidden;
}
.cta::before{content:'';position:absolute;top:-50%;left:-20%;width:60%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 60%);border-radius:50%}
.cta h2{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:800;margin-bottom:16px;position:relative}
.cta p{color:rgba(255,255,255,.85);font-size:1.1rem;margin-bottom:32px;max-width:600px;margin-left:auto;margin-right:auto;position:relative}
.cta .btn{position:relative;background:#fff;color:var(--azul-800)}
.cta .btn:hover{background:var(--azul-50);transform:translateY(-2px)}
@media(max-width:600px){.cta{padding:40px 24px}}

/* ============================================================
   PÁGINAS INTERNAS (SOBRE, SERVIÇOS, etc.)
   ============================================================ */
.page-header{
  background:linear-gradient(135deg,var(--azul-800),var(--azul-600));
  padding:60px 0 48px;color:#fff;text-align:center;position:relative;overflow:hidden;
}
.page-header::before{content:'';position:absolute;top:-50%;right:-10%;width:40%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 60%);border-radius:50%}
.page-header h1{font-size:clamp(1.8rem,3.5vw,2.6rem);font-weight:800;margin-bottom:12px;position:relative}
.page-header p{color:rgba(255,255,255,.85);max-width:600px;margin:0 auto;position:relative}
.breadcrumb{display:flex;justify-content:center;gap:8px;font-size:.85rem;color:rgba(255,255,255,.7);margin-top:16px;position:relative;flex-wrap:wrap}
.breadcrumb a:hover{color:#fff}
.breadcrumb span{color:rgba(255,255,255,.5)}

/* ============================================================
   FORMULÁRIOS
   ============================================================ */
.form-grupo{margin-bottom:20px}
.form-label{display:block;font-weight:600;font-size:.9rem;color:var(--cinza-700);margin-bottom:8px}
.form-label .obrigatorio{color:var(--perigo)}
.form-input,.form-select,.form-textarea{
  width:100%;padding:12px 16px;border:1.5px solid var(--cinza-200);border-radius:var(--radius-sm);
  background:var(--branco);transition:var(--transicao);color:var(--cinza-900);font-size:.95rem;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  outline:none;border-color:var(--azul-500);box-shadow:0 0 0 4px rgba(43,140,224,.1);
}
.form-input.erro,.form-select.erro,.form-textarea.erro{border-color:var(--perigo);box-shadow:0 0 0 4px rgba(239,68,68,.1)}
.form-erro{color:var(--perigo);font-size:.8rem;margin-top:6px;display:none}
.form-erro.visivel{display:block}
.form-textarea{resize:vertical;min-height:120px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.form-card{background:var(--branco);border:1px solid var(--cinza-200);border-radius:var(--radius);padding:32px;box-shadow:var(--sombra-sm)}
.form-seccao-titulo{
  font-size:1.1rem;font-weight:700;color:var(--azul-800);margin-bottom:24px;padding-bottom:12px;
  border-bottom:2px solid var(--azul-100);display:flex;align-items:center;gap:10px;
}
.form-seccao-titulo .num{
  width:28px;height:28px;background:var(--azul-600);color:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;
}

/* ============================================================
   ALERTAS / MENSAGENS
   ============================================================ */
.alerta{
  padding:16px 20px;border-radius:var(--radius-sm);display:flex;align-items:flex-start;gap:12px;
  font-size:.9rem;margin-bottom:20px;animation:slideDown .3s ease;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.alerta-sucesso{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.alerta-erro{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.alerta-info{background:var(--azul-50);color:var(--azul-800);border:1px solid var(--azul-100)}
.alerta svg{flex-shrink:0;margin-top:2px}

/* ============================================================
   LOADING
   ============================================================ */
.loading-overlay{
  position:fixed;inset:0;background:rgba(255,255,255,.9);backdrop-filter:blur(4px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px;
}
.spinner{
  width:48px;height:48px;border:4px solid var(--azul-100);border-top-color:var(--azul-600);
  border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-sm{width:20px;height:20px;border-width:3px}

/* ============================================================
   TABELAS ADMIN
   ============================================================ */
.tabela-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--cinza-200);background:#fff}
.tabela{width:100%;border-collapse:collapse;min-width:700px}
.tabela th{
  text-align:left;padding:14px 16px;font-size:.8rem;font-weight:700;color:var(--cinza-500);
  text-transform:uppercase;letter-spacing:.5px;background:var(--cinza-50);border-bottom:1px solid var(--cinza-200);
  white-space:nowrap;
}
.tabela th.sortable{cursor:pointer;user-select:none}
.tabela th.sortable:hover{color:var(--azul-600)}
.tabela th .sort-icon{display:inline-block;margin-left:4px;opacity:.4}
.tabela td{padding:14px 16px;border-bottom:1px solid var(--cinza-100);font-size:.9rem;color:var(--cinza-700)}
.tabela tbody tr{transition:var(--transicao)}
.tabela tbody tr:hover{background:var(--azul-50)}
.tabela tbody tr:last-child td{border-bottom:none}
.tabela .acoes{display:flex;gap:8px;flex-wrap:wrap}

/* Badges de estado */
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;
  font-size:.78rem;font-weight:600;white-space:nowrap;
}
.badge-novo{background:#dbeafe;color:#1e40af}
.badge-analise{background:#fef3c7;color:#92400e}
.badge-contactado{background:#e0e7ff;color:#3730a3}
.badge-concluido{background:#d1fae5;color:#065f46}
.badge-ativo{background:#d1fae5;color:#065f46}
.badge-inativo{background:#fee2e2;color:#991b1b}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}

/* ============================================================
   FILTROS / PESQUISA
   ============================================================ */
.filtros{
  display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;align-items:center;
  background:#fff;padding:16px;border-radius:var(--radius);border:1px solid var(--cinza-200);
}
.filtros .form-input,.filtros .form-select{width:auto;min-width:180px;flex:1;max-width:280px}
.search-box{position:relative;flex:1;min-width:200px;max-width:320px}
.search-box .form-input{padding-left:42px;width:100%;max-width:none}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--cinza-500);pointer-events:none}

/* Paginação */
.paginacao{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:24px;flex-wrap:wrap}
.paginacao button{
  min-width:38px;height:38px;border-radius:8px;border:1px solid var(--cinza-200);background:#fff;
  font-size:.9rem;font-weight:600;color:var(--cinza-700);transition:var(--transicao);
}
.paginacao button:hover:not(:disabled){border-color:var(--azul-500);color:var(--azul-600)}
.paginacao button.ativo{background:var(--azul-600);border-color:var(--azul-600);color:#fff}
.paginacao button:disabled{opacity:.4;cursor:not-allowed}
.paginacao .info{font-size:.85rem;color:var(--cinza-500);margin:0 12px}

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(10,37,64,.5);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:2000;padding:24px;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:var(--radius-lg);max-width:600px;width:100%;max-height:90vh;
  overflow-y:auto;box-shadow:var(--sombra-lg);animation:modalUp .3s ease;
}
@keyframes modalUp{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;padding:24px 28px;
  border-bottom:1px solid var(--cinza-200);position:sticky;top:0;background:#fff;z-index:10;border-radius:var(--radius-lg) var(--radius-lg) 0 0;
}
.modal-header h3{font-size:1.2rem;font-weight:700;color:var(--azul-900)}
.modal-fechar{
  width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--cinza-500);transition:var(--transicao);
}
.modal-fechar:hover{background:var(--cinza-100);color:var(--cinza-900)}
.modal-body{padding:28px}
.modal-footer{padding:20px 28px;border-top:1px solid var(--cinza-200);display:flex;justify-content:flex-end;gap:12px;position:sticky;bottom:0;background:#fff;border-radius:0 0 var(--radius-lg) var(--radius-lg)}

/* ============================================================
   ADMIN LAYOUT
   ============================================================ */
.admin-layout{display:flex;min-height:100vh;background:var(--cinza-50)}
.sidebar{
  width:260px;background:linear-gradient(180deg,var(--azul-800),var(--azul-900));
  color:#fff;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100;
  transition:transform .3s ease;
}
.sidebar-logo{padding:24px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo .logo-icon{background:rgba(255,255,255,.15)}

.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}

  background:#fff;border-radius:var(--radius);padding:24px;border:1px solid var(--cinza-200);

}
.admin-card-icone.azul{background:#dbeafe;color:#1e40af}
.admin-card-icone.amarelo{background:#fef3c7;color:#92400e}
.admin-card-icone.roxo{background:#e0e7ff;color:#3730a3}
.admin-card-icone.verde{background:#d1fae5;color:#065f46}
.admin-card-info h3{font-size:1.6rem;font-weight:800;color:var(--azul-900);line-height:1}
.admin-card-info span{font-size:.82rem;color:var(--cinza-500);font-weight:500}

.grafico-card h3{font-size:1.1rem;font-weight:700;color:var(--azul-900);margin-bottom:24px}

.grafico-barra{
  width:100%;max-width:60px;background:linear-gradient(180deg,var(--azul-500),var(--azul-700));

}
.grafico-barra:hover{background:linear-gradient(180deg,var(--azul-400),var(--azul-600))}
.grafico-barra .valor{
  position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:.8rem;font-weight:700;color:var(--azul-700);
}
.grafico-label{font-size:.75rem;color:var(--cinza-500);font-weight:500}

/* ============================================================
   LOGIN
   ============================================================ */
.login-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(135deg,var(--azul-900),var(--azul-700));position:relative;overflow:hidden;
}
.login-page::before{content:'';position:absolute;top:-30%;right:-20%;width:60%;height:160%;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 60%);border-radius:50%}
.login-page::after{content:'';position:absolute;bottom:-30%;left:-20%;width:50%;height:140%;background:radial-gradient(circle,rgba(255,255,255,.05),transparent 60%);border-radius:50%}
.login-card{
  background:#fff;border-radius:var(--radius-lg);padding:48px;max-width:440px;width:100%;
  box-shadow:var(--sombra-lg);position:relative;z-index:1;
}
.login-logo{display:flex;flex-direction:column;align-items:center;margin-bottom:32px;text-align:center}
.login-logo .logo-icon{width:56px;height:56px;font-size:1.3rem;margin-bottom:16px}
.login-logo h2{font-size:1.4rem;font-weight:800;color:var(--azul-900)}
.login-logo p{font-size:.9rem;color:var(--cinza-500);margin-top:4px}
.login-card .form-grupo{margin-bottom:20px}
.login-card .btn{margin-top:8px}
.login-extra{text-align:center;margin-top:20px;font-size:.85rem}
.login-extra a{color:var(--azul-600);font-weight:600}
.login-extra a:hover{text-decoration:underline}

/* ============================================================
   BOTÃO FLUTUANTE WHATSAPP
   ============================================================ */
.whatsapp-float{
  position:fixed;bottom:24px;right:24px;width:60px;height:60px;background:#25d366;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 24px rgba(37,211,102,.4);
  z-index:900;transition:var(--transicao);animation:float 3s ease-in-out infinite;
}
.whatsapp-float:hover{transform:scale(1.1);box-shadow:0 12px 32px rgba(37,211,102,.5)}

.whatsapp-float svg{width:32px;height:32px}
@media(max-width:600px){.whatsapp-float{width:52px;height:52px;bottom:16px;right:16px}.whatsapp-float svg{width:26px;height:26px}}

   ============================================================ */

.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1.5fr;gap:40px;padding-bottom:48px}

function icone(nome, tamanho=20){
  const svg = ICONES[nome] || ICONES.info;
  return `<span style="display:inline-flex;width:${tamanho}px;height:${tamanho}px">${svg}</span>`;
}

/* ============================================================
   HELPERS
   ============================================================ */
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild}
function formatarData(dataStr){
  if(!dataStr) return '—';
  const d = new Date(dataStr);
  return d.toLocaleDateString('pt-MZ',{day:'2-digit',month:'short',year:'numeric'});
}
function badgeEstado(estado){
  const mapa = {'Novo':'badge-novo','Em análise':'badge-analise','Contactado':'badge-contactado','Concluído':'badge-concluido'};
  return `<span class="badge ${mapa[estado]||'badge-novo'}">${estado}</span>`;
}
function gerarIdPedido(){
  const max = Math.max(...state.pedidos.map(p=>parseInt(p.id.replace('PED-',''))||0));
  return 'PED-'+String(max+1).padStart(3,'0');
}
function mostrarAlerta(container, tipo, msg){
  const cores = {sucesso:'alerta-sucesso',erro:'alerta-erro',info:'alerta-info'};
  const icon = tipo==='sucesso'?icone('check',18):tipo==='erro'?icone('alert',18):icone('info',18);
  const div = el(`<div class="alerta ${cores[tipo]}">${icon}<span>${msg}</span></div>`);
  container.prepend(div);
  setTimeout(()=>{div.style.opacity='0';div.style.transition='opacity .3s';setTimeout(()=>div.remove(),300)},5000);
}
function validarCampo(input, condicao, msgErro){
  const grupo = input.closest('.form-grupo');
  let erroEl = grupo.querySelector('.form-erro');
  if(!erroEl){erroEl = el('<div class="form-erro"></div>');grupo.appendChild(erroEl)}
  if(condicao){
    input.classList.remove('erro');erroEl.classList.remove('visivel');
    return true;
  } else {
    input.classList.add('erro');erroEl.textContent = msgErro;erroEl.classList.add('visivel');
    return false;
  }
}
function validarEmail(email){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)}
function validarTelefone(tel){return /^[+\d][\d\s]{7,}$/.test(tel.trim())}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
function navegar(pagina, dados){
  state.pagina = pagina;
  if(dados) Object.assign(state, dados);
  render();
  scrollTop();
  // Fechar menu mobile
  const nav = document.querySelector('.nav-publico');
  if(nav) nav.classList.remove('aberto');
}

   RENDER PRINCIPAL
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  if(state.pagina.startsWith('admin-') && !state.autenticado){
    state.pagina = 'login';
  }
  if(state.pagina === 'login' || state.pagina.startsWith('admin-')){
    app.innerHTML = renderAdmin();
    inicializarEventosAdmin();
  } else {
    app.innerHTML = renderPublico();
    inicializarEventosPublico();
  }
}

/* ============================================================
   WEBSITE PÚBLICO
   ============================================================ */
function renderPublico(){
  return `
    ${renderHeaderPublico()}
    <main>${renderPaginaPublica()}</main>
    ${renderFooter()}
  `;
}

function renderHeaderPublico(){
  const links = [
    {id:'inicio', label:'Início'},
    {id:'sobre', label:'Sobre Nós'},
    {id:'servicos', label:'Serviços'},
    {id:'orcamento', label:'Solicitar Orçamento'},
    {id:'contactos', label:'Contactos'}
  ];
  return `
  <header class="header-publico">
    <div class="container header-inner">
      <a href="#" class="logo" onclick="event.preventDefault();navegar('inicio')">
        <div class="logo-icon">CEO</div>
        <div class="logo-text">CEO<small>Saúde Ocupacional</small></div>
      </a>
      <nav class="nav-publico" id="navPublico">
        ${links.map(l=>`<a href="#" class="${state.pagina===l.id?'ativo':''}" onclick="event.preventDefault();navegar('${l.id}')">${l.label}</a>`).join('')}
      </nav>
      <div class="header-acoes">
        <button class="btn btn-outline btn-sm" onclick="navegar('login')">${icone('lock',16)} Área Admin</button>
        <button class="btn btn-primario btn-sm" onclick="navegar('orcamento')">Orçamento</button>
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">${icone('menu',24)}</button>
      </div>
    </div>
  </header>`;
}

function renderPaginaPublica(){
  switch(state.pagina){
    case 'inicio': return renderInicio();
    case 'sobre': return renderSobre();
    case 'servicos': return renderServicos();
    case 'servico-detalhes': return renderServicoDetalhes();
    case 'orcamento': return renderOrcamento();
    case 'contactos': return renderContactos();
    default: return renderInicio();
  }
}

   ============================================================ */
function inicializarEventosPublico(){
  // Menu mobile
  const menuToggle = document.getElementById('menuToggle');
  const navPublico = document.getElementById('navPublico');
  if(menuToggle && navPublico){
    menuToggle.addEventListener('click',()=>{
      navPublico.classList.toggle('aberto');
      menuToggle.innerHTML = navPublico.classList.contains('aberto') ? icone('close',24) : icone('menu',24);
    });
  }

  // Filtros de serviços
  document.querySelectorAll('.filtro-categoria').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.filtro-categoria').forEach(b=>{b.classList.remove('ativo','btn-outline');b.classList.add('btn-ghost')});
      btn.classList.add('ativo','btn-outline');btn.classList.remove('btn-ghost');
      const cat = btn.dataset.cat;
      document.querySelectorAll('.servico-item').forEach(item=>{
        item.style.display = (cat==='todos' || item.dataset.categoria===cat) ? '' : 'none';
      });
    });
  });

  // Formulário de orçamento
  const formOrc = document.getElementById('formOrcamento');
  if(formOrc){
    formOrc.addEventListener('submit', e=>{
      e.preventDefault();
      const alerta = document.getElementById('alertaOrcamento');
      alerta.innerHTML = '';
      let valido = true;
      const campos = {
        empresa:{val:v=>v.trim()!=='',msg:'Campo obrigatório'},
        sector:{val:v=>v!=='',msg:'Selecione um sector'},
        colaboradores:{val:v=>v && parseInt(v)>0,msg:'Informe um número válido'},
        localizacao:{val:v=>v.trim()!=='',msg:'Campo obrigatório'},
        responsavel:{val:v=>v.trim()!=='',msg:'Campo obrigatório'},
        telefone:{val:v=>validarTelefone(v),msg:'Telefone inválido'},
        email:{val:v=>validarEmail(v),msg:'Email inválido'},
        servico:{val:v=>v!=='',msg:'Selecione um serviço'}
      };
      for(const [name, regra] of Object.entries(campos)){
        const input = formOrc.elements[name];
        if(!validarCampo(input, regra.val(input.value), regra.msg)) valido = false;
      }
      if(!valido){
        mostrarAlerta(alerta,'erro','Por favor, corrija os campos assinalados.');
        return;
      }
      // Simular envio
      const btn = document.getElementById('btnEnviarOrcamento');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner spinner-sm"></span> A enviar...';
      const overlay = el('<div class="loading-overlay"><div class="spinner"></div><p style="color:var(--azul-700);font-weight:600">A processar a sua solicitação...</p></div>');
      document.body.appendChild(overlay);
      setTimeout(()=>{
        overlay.remove();
        // Adicionar pedido fictício
        const novoPedido = {
          id: gerarIdPedido(),
          empresa: formOrc.elements.empresa.value,
          nuit: formOrc.elements.nuit.value || '—',
          sector: formOrc.elements.sector.value,
          colaboradores: formOrc.elements.colaboradores.value,
          localizacao: formOrc.elements.localizacao.value,
          responsavel: formOrc.elements.responsavel.value,
          cargo: formOrc.elements.cargo.value || '—',
          telefone: formOrc.elements.telefone.value,
          email: formOrc.elements.email.value,
          servico: formOrc.elements.servico.value,
          dataPretendida: formOrc.elements.dataPretendida.value || '—',
          mensagem: formOrc.elements.mensagem.value || '—',
          dataPedido: new Date().toISOString().split('T')[0],
          estado: 'Novo'
        };
        state.pedidos.unshift(novoPedido);
        formOrc.reset();
        btn.disabled = false;
        btn.innerHTML = icone('clipboard',20)+' Enviar solicitação';
        mostrarAlerta(alerta,'sucesso','Solicitação enviada com sucesso. A equipa da CEO entrará em contacto consigo.');
      }, 2000);
    });
  }

  // Formulário de contacto
  const formCont = document.getElementById('formContacto');
  if(formCont){
    formCont.addEventListener('submit', e=>{
      e.preventDefault();
      const alerta = document.getElementById('alertaContacto');
      alerta.innerHTML = '';
      let valido = true;
      const campos = {
        nome:{val:v=>v.trim()!=='',msg:'Campo obrigatório'},
        email:{val:v=>validarEmail(v),msg:'Email inválido'},
        assunto:{val:v=>v.trim()!=='',msg:'Campo obrigatório'},
        mensagem:{val:v=>v.trim()!=='',msg:'Campo obrigatório'}
      };
      for(const [name, regra] of Object.entries(campos)){
        const input = formCont.elements[name];
        if(!validarCampo(input, regra.val(input.value), regra.msg)) valido = false;
      }
      if(!valido){mostrarAlerta(alerta,'erro','Por favor, corrija os campos assinalados.');return}
      const btn = formCont.querySelector('button[type=submit]');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner spinner-sm"></span> A enviar...';
      setTimeout(()=>{
        formCont.reset();
        btn.disabled = false;
        btn.innerHTML = icone('mail',18)+' Enviar mensagem';
        mostrarAlerta(alerta,'sucesso','Mensagem enviada com sucesso. Entraremos em contacto brevemente.');
      }, 1500);
    });
  }
}

/* ============================================================
   PEDIDOS
   ============================================================ */
function renderPedidos(){
  // Filtrar
  let filtrados = [...state.pedidos];
  if(state.filtroEstado !== 'todos') filtrados = filtrados.filter(p=>p.estado===state.filtroEstado);
  if(state.filtroServico !== 'todos') filtrados = filtrados.filter(p=>p.servico===state.filtroServico);
  if(state.pesquisaPedidos){
    const q = state.pesquisaPedidos.toLowerCase();
    filtrados = filtrados.filter(p=>p.empresa.toLowerCase().includes(q)||p.responsavel.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)||p.servico.toLowerCase().includes(q));
  }
  // Ordenar
  filtrados.sort((a,b)=>{
    let va = a[state.ordenacao.campo]||'', vb = b[state.ordenacao.campo]||'';
    if(state.ordenacao.campo==='id'){va=parseInt(va.replace('PED-',''));vb=parseInt(vb.replace('PED-',''))}
    if(va<vb) return state.ordenacao.direcao==='asc'?-1:1;
    if(va>vb) return state.ordenacao.direcao==='asc'?1:-1;
    return 0;
  });
  // Paginação
  const total = filtrados.length;
  const totalPag = Math.ceil(total/state.itensPorPagina)||1;
  if(state.paginaAtual>totalPag) state.paginaAtual=totalPag;
  const inicio = (state.paginaAtual-1)*state.itensPorPagina;
  const paginados = filtrados.slice(inicio, inicio+state.itensPorPagina);

  const servicosOpts = [...new Set(state.pedidos.map(p=>p.servico))];

  const setaOrdem = (campo)=>{
    if(state.ordenacao.campo===campo){
      state.ordenacao.direcao = state.ordenacao.direcao==='asc'?'desc':'asc';
    } else {
      state.ordenacao.campo = campo; state.ordenacao.direcao='asc';
    }
    render();
  };
  const sortIcon = (campo)=>{
    if(state.ordenacao.campo!==campo) return '<span class="sort-icon">↕</span>';
    return `<span class="sort-icon" style="opacity:1">${state.ordenacao.direcao==='asc'?'↑':'↓'}</span>`;
  };

  return `
  <div class="filtros">
    <div class="search-box">
      ${icone('search',18)}
      <input type="text" class="form-input" id="pesquisaPedidos" placeholder="Pesquisar por empresa, responsável, ID..." value="${state.pesquisaPedidos}">
    </div>
    <select class="form-select" id="filtroEstado">
      <option value="todos">Todos os estados</option>
      ${['Novo','Em análise','Contactado','Concluído'].map(e=>`<option ${state.filtroEstado===e?'selected':''}>${e}</option>`).join('')}
    </select>
    <select class="form-select" id="filtroServico">
      <option value="todos">Todos os serviços</option>
      ${servicosOpts.map(s=>`<option ${state.filtroServico===s?'selected':''}>${s}</option>`).join('')}
    </select>
  </div>

  <div class="tabela-wrap">
    <table class="tabela">
      <thead>
        <tr>
          <th class="sortable" onclick="setaOrdemPedidos('id')">ID ${sortIcon('id')}</th>
          <th class="sortable" onclick="setaOrdemPedidos('empresa')">Empresa ${sortIcon('empresa')}</th>
          <th>Responsável</th>
          <th>Serviço</th>
          <th>Telefone</th>
          <th class="sortable" onclick="setaOrdemPedidos('dataPedido')">Data ${sortIcon('dataPedido')}</th>
          <th>Estado</th>
          <th>Acções</th>
        </tr>
      </thead>
      <tbody>
        ${paginados.length?paginados.map(p=>`
          <tr>
            <td><strong>${p.id}</strong></td>
            <td>${p.empresa}</td>
            <td>${p.responsavel}</td>
            <td>${p.servico}</td>
            <td>${p.telefone}</td>
            <td>${formatarData(p.dataPedido)}</td>
            <td>${badgeEstado(p.estado)}</td>
            <td class="acoes">
              <button class="btn btn-sm btn-outline" onclick="state.pedidoSelecionado='${p.id}';state.pagina='admin-pedido-detalhes';render()">${icone('eye',14)} Ver</button>
              <button class="btn btn-sm btn-ghost" onclick="editarEstadoRapido('${p.id}')">${icone('edit',14)} Estado</button>
            </td>
          </tr>`).join(''):`<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--cinza-500)">Nenhum pedido encontrado.</td></tr>`}
      </tbody>
    </table>
  </div>

  ${totalPag>1?`
  <div class="paginacao">
    <button ${state.paginaAtual===1?'disabled':''} onclick="state.paginaAtual--;render()">${icone('chevron-left',16)}</button>
    ${Array.from({length:totalPag},(_,i)=>i+1).map(n=>`<button class="${n===state.paginaAtual?'ativo':''}" onclick="state.paginaAtual=${n};render()">${n}</button>`).join('')}
    <button ${state.paginaAtual===totalPag?'disabled':''} onclick="state.paginaAtual++;render()">${icone('chevron-right',16)}</button>
    <span class="info">${total} pedido(s)</span>
  </div>`:''}
  `;
}

function setaOrdemPedidos(campo){
  if(state.ordenacao.campo===campo){
    state.ordenacao.direcao = state.ordenacao.direcao==='asc'?'desc':'asc';
  } else {
    state.ordenacao.campo = campo; state.ordenacao.direcao='asc';
  }
  render();
}

function editarEstadoRapido(id){
  const p = state.pedidos.find(x=>x.id===id);
  if(!p) return;
  const estados = ['Novo','Em análise','Contactado','Concluído'];
  const idx = estados.indexOf(p.estado);
  p.estado = estados[(idx+1)%estados.length];
  render();
}

}

function guardarEstadoPedido(id){
  const p = state.pedidos.find(x=>x.id===id);
  const novo = document.getElementById('selectEstadoPedido').value;
  p.estado = novo;
  const alerta = document.getElementById('alertaPedido');
  alerta.innerHTML = '';
  mostrarAlerta(alerta,'sucesso','Estado actualizado com sucesso.');
  render();
}

/* ============================================================
   GESTÃO DE SERVIÇOS (ADMIN)
   ============================================================ */
function renderAdminServicos(){
  return `
  <div class="flex justify-between items-center mb-24" style="flex-wrap:wrap;gap:12px">
    <p style="color:var(--cinza-500);font-size:.9rem">${state.servicosAdmin.length} serviço(s) registado(s)</p>
    <button class="btn btn-primario" onclick="abrirModalNovoServico()">${icone('plus',18)} Adicionar serviço</button>
  </div>
  <div class="tabela-wrap">
    <table class="tabela">
      <thead><tr><th>Serviço</th><th>Categoria</th><th>Estado</th><th>Acções</th></tr></thead>
      <tbody>
        ${state.servicosAdmin.map(s=>`
          <tr>
            <td><div class="flex items-center gap-12"><div class="card-icone" style="width:36px;height:36px;margin:0">${icone(s.icone,18)}</div><strong>${s.nome}</strong></div></td>
            <td>${s.categoria}</td>
            <td>${s.ativo?'<span class="badge badge-ativo">Activo</span>':'<span class="badge badge-inativo">Inactivo</span>'}</td>
            <td class="acoes">
              <button class="btn btn-sm btn-outline" onclick="editarServico(${s.id})">${icone('edit',14)} Editar</button>
              <button class="btn btn-sm ${s.ativo?'btn-ghost':'btn-primario'}" onclick="toggleServico(${s.id})">${s.ativo?'Desactivar':'Activar'}</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
  </div>
  <div id="modalContainer"></div>`;
}

function abrirModalNovoServico(){
  const modal = el(`
  <div class="modal-overlay" onclick="if(event.target===this)fecharModal()">
    <div class="modal">
      <div class="modal-header">
        <h3>Novo Serviço</h3>
        <button class="modal-fechar" onclick="fecharModal()">${icone('close',20)}</button>
      </div>
      <div class="modal-body">
        <div class="form-grupo"><label class="form-label">Nome do serviço</label><input type="text" class="form-input" id="novoServicoNome" placeholder="Ex: Consultoria em Segurança"></div>
        <div class="form-grupo"><label class="form-label">Categoria</label>
          <select class="form-select" id="novoServicoCategoria"><option>Documentação</option><option>Clínica</option><option>Operacional</option><option>Formação</option></select>
        </div>
        <div class="form-grupo"><label class="form-label">Descrição</label><textarea class="form-textarea" id="novoServicoDesc" placeholder="Breve descrição do serviço..."></textarea></div>
        <div class="form-grupo"><label class="form-label">Estado</label>
          <select class="form-select" id="novoServicoEstado"><option value="true">Activo</option><option value="false">Inactivo</option></select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primario" onclick="guardarNovoServico()">${icone('save',18)} Guardar</button>
      </div>
    </div>
  </div>`);
  document.getElementById('modalContainer').appendChild(modal);
}

function fecharModal(){
  const m = document.querySelector('.modal-overlay');
  if(m) m.remove();
}

function guardarNovoServico(){
  const nome = document.getElementById('novoServicoNome').value.trim();
  const cat = document.getElementById('novoServicoCategoria').value;
  const desc = document.getElementById('novoServicoDesc').value.trim();
  const ativo = document.getElementById('novoServicoEstado').value==='true';
  if(!nome){alert('Informe o nome do serviço.');return}
  const novoId = Math.max(...state.servicosAdmin.map(s=>s.id))+1;
  state.servicosAdmin.push({id:novoId, nome, categoria:cat, icone:'briefcase', desc:desc||'Serviço personalizado.', ativo, detalhes:{descricaoCompleta:desc||'', beneficios:[], incluido:[], extra:''}});
  fecharModal();
  render();
}

function editarServico(id){
  const s = state.servicosAdmin.find(x=>x.id===id);
  const modal = el(`
  <div class="modal-overlay" onclick="if(event.target===this)fecharModal()">
    <div class="modal">
      <div class="modal-header"><h3>Editar Serviço</h3><button class="modal-fechar" onclick="fecharModal()">${icone('close',20)}</button></div>
      <div class="modal-body">
        <div class="form-grupo"><label class="form-label">Nome</label><input type="text" class="form-input" id="editServicoNome" value="${s.nome}"></div>
        <div class="form-grupo"><label class="form-label">Categoria</label>
          <select class="form-select" id="editServicoCategoria">
            ${['Documentação','Clínica','Operacional','Formação'].map(c=>`<option ${s.categoria===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="form-grupo"><label class="form-label">Descrição</label><textarea class="form-textarea" id="editServicoDesc">${s.desc}</textarea></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primario" onclick="guardarEdicaoServico(${s.id})">${icone('save',18)} Guardar</button>
      </div>
    </div>
  </div>`);
  document.getElementById('modalContainer').appendChild(modal);
}

function guardarEdicaoServico(id){
  const s = state.servicosAdmin.find(x=>x.id===id);
  s.nome = document.getElementById('editServicoNome').value.trim();
  s.categoria = document.getElementById('editServicoCategoria').value;
  s.desc = document.getElementById('editServicoDesc').value.trim();
  fecharModal();
  render();
}

function toggleServico(id){
  const s = state.servicosAdmin.find(x=>x.id===id);
  s.ativo = !s.ativo;
  render();
}

}

/* ============================================================
   EVENTOS ADMIN
   ============================================================ */
function inicializarEventosAdmin(){
  // Login
  const formLogin = document.getElementById('formLogin');
  if(formLogin){
    formLogin.addEventListener('submit', e=>{
      e.preventDefault();
      const email = formLogin.elements.email.value;
      const pass = formLogin.elements.password.value;
      const alerta = document.getElementById('alertaLogin');
      alerta.innerHTML = '';
      if(!validarEmail(email) || pass.length<4){
        mostrarAlerta(alerta,'erro','Credenciais inválidas. Utilize admin@ceo.co.mz / admin123');
        return;
      }
      const btn = formLogin.querySelector('button[type=submit]');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner spinner-sm"></span> A entrar...';
      setTimeout(()=>{
        state.autenticado = true;
        state.pagina = 'admin-dashboard';
        render();
      }, 1200);
    });
  }

  // Sidebar mobile
  const adminMenuToggle = document.getElementById('adminMenuToggle');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if(adminMenuToggle && sidebar){
    adminMenuToggle.addEventListener('click',()=>{
      sidebar.classList.toggle('aberto');
      if(overlay) overlay.classList.toggle('visivel', sidebar.classList.contains('aberto'));
    });
    if(overlay){
      overlay.addEventListener('click',()=>{
        sidebar.classList.remove('aberto');
        overlay.classList.remove('visivel');
      });
    }
  }

  // Filtros de pedidos
  const pesquisa = document.getElementById('pesquisaPedidos');
  if(pesquisa){
    pesquisa.addEventListener('input', e=>{
      state.pesquisaPedidos = e.target.value;
      state.paginaAtual = 1;
      render();
      const novo = document.getElementById('pesquisaPedidos');
      if(novo){novo.focus();novo.setSelectionRange(novo.value.length,novo.value.length)}
    });
  }
  const fEstado = document.getElementById('filtroEstado');
  if(fEstado) fEstado.addEventListener('change', e=>{state.filtroEstado=e.target.value;state.paginaAtual=1;render()});
  const fServico = document.getElementById('filtroServico');
  if(fServico) fServico.addEventListener('change', e=>{state.filtroServico=e.target.value;state.paginaAtual=1;render()});
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
render();
</script>
